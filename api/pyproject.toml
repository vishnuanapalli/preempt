[project]
name = "preempt"
version = "0.1.0"
description = "Compare spot pricing and interruption risk across AWS, Azure, and GCP."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx2>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit — security
    "RUF",
]
# S101 (assert) is the point of a test file.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# A silently ignored missing stub is how a type gate stops catching anything.
disallow_any_unimported = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test that neither asserts nor errors is not a test.
addopts = "-q --strict-markers"
markers = [
    "integration: requires a real database; excluded from the default unit run",
]
