[project]
name = "preempt"
version = "0.1.0"
description = "Compare spot pricing and interruption risk across AWS, Azure, and GCP."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit — security
    "RUF",
]
# S101 (assert) is the point of a test file.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# A silently ignored missing stub is how a type gate stops catching anything.
disallow_any_unimported = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test that neither asserts nor errors is not a test.
#
# `-ra` because under `-q` a skip is a dot. The integration tests skip when no database is
# reachable, and their skip messages say exactly what is then unproven — printing them is
# what stops a run with nothing verified from looking like a run that verified everything.
addopts = "-q -ra --strict-markers"
markers = [
    "integration: requires a real database; skipped with a reason when none is reachable",
]

[tool.vercel]
# Explicit entrypoint rather than relying on Vercel's auto-detection. Detection looks
# for a supported path relative to the project root; making it explicit means the
# deployment does not silently build something else when the layout changes.
entrypoint = "app.main:app"
