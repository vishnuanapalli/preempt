# Local development database.
#
# Matched to Neon on major version and TimescaleDB version, NOT on patch. This tag ships
# PostgreSQL 18.1; Neon was observed at 18.4, and timescaledb is 2.24.0 on both (the
# extension version was verified by querying the live project's pg_available_extensions;
# the patch difference has not been re-verified since). The image tag pins the major line,
# so "pinned to exactly what Neon runs" — which this comment said until 2026-07-29 — was
# never true of the patch number. `audit/PREFLIGHT.txt` records what is actually running.
#
# The `-oss` variant is deliberate. Neon's free tier offers only the Apache-2
# licensed subset of TimescaleDB — which is why compression is unavailable there.
# The OSS image has the same restriction, so a licensed-only feature fails here on
# a laptop rather than in production. Using the full image locally would let a
# capability exist in development that cannot exist in production, which is the
# most expensive kind of environment drift.
#
# `latest` is avoided on purpose: an image that silently changes underneath the
# project turns a reproducible environment into an irreproducible one.

services:
  db:
    image: timescale/timescaledb:2.24.0-pg18-oss
    container_name: preempt-db
    environment:
      POSTGRES_USER: preempt
      POSTGRES_PASSWORD: preempt_local_only
      POSTGRES_DB: preempt
    ports:
      - "5433:5432"   # 5433 to avoid colliding with any local Postgres on 5432
    volumes:
      - preempt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preempt -d preempt"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Integration tests get their own database, never the dev one.
  #
  # This is not a preference. In prior work in this domain a test fixture truncated
  # the same database the demo ran on, destroying demo data and then breaking the
  # next backfill through orphaned rows. On Neon this role is filled by a branch.
  db-test:
    image: timescale/timescaledb:2.24.0-pg18-oss
    container_name: preempt-db-test
    environment:
      POSTGRES_USER: preempt
      POSTGRES_PASSWORD: preempt_local_only
      POSTGRES_DB: preempt_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral: tests must never depend on prior state
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preempt -d preempt_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  preempt-db-data:
